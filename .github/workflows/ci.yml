name: Continuous integration

on:
  push:
    branches: [codex/restaurant-booking-platform]
  pull_request:
    branches: [codex/restaurant-booking-platform]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mocvi_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mocvi_test_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/mocvi_test_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Identity contract tests
        run: pnpm test:identity:contract

      - name: Recovery SDK cookie storage
        run: pnpm test:identity:storage

      - name: Combo catalogue contract tests
        run: pnpm test:combos

      - name: Customer order API contract tests
        run: pnpm test:order

      - name: Backup encryption and restore safety guards
        run: pnpm test:backup

      - name: Booking contract tests
        run: pnpm test:booking

      - name: Customer booking contract tests
        run: pnpm test:customer-booking

      - name: Staff contract tests
        run: pnpm test:staff

      - name: Admin access confirmation regression
        run: node scripts/test-admin-role-confirmation.mjs

      - name: Public asset and spatial checks
        run: pnpm test:public-assets

      - name: Database integration tests
        run: pnpm test:db

      - name: Normal production build
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-anon-key
        run: pnpm build

      - name: Start isolated server
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-anon-key
          BOOKING_LOCAL_MUTATIONS_ENABLED: "false"
        shell: bash
        run: |
          node scripts/test-supabase-http-mock.mjs > supabase-mock.log 2>&1 &
          pnpm start --hostname 127.0.0.1 --port 3000 > next-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat next-server.log
          exit 1

      - name: HTTP identity and booking smoke
        env:
          IDENTITY_SMOKE_URL: http://127.0.0.1:3000
          BOOKING_TEST_BASE_URL: http://127.0.0.1:3000
        run: |
          pnpm test:identity:smoke
          pnpm test:booking

      - name: GitHub Pages build
        env:
          GITHUB_PAGES: "true"
        run: pnpm build

      - name: Verify Pages export
        env:
          PUBLIC_CHECK_PAGES: "true"
          BOOKING_CHECK_PAGES: "true"
        run: |
          pnpm test:public-assets
          pnpm test:booking
